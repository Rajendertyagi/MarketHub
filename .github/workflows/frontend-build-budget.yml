name: frontend-build-budget

# WS1-05: Frontend production build and bundle budget gate.
# Runs TypeScript checks, Vite production build, and bundle budget enforcement.
# No backend tests, no deploy/release/publish actions.

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-budget.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build-budget.yml"

permissions:
  contents: read

jobs:
  build-budget:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and enforce bundle budgets
        run: bun run build

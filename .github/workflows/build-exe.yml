name: Build Windows EXE (Nuitka)

# Build a standalone MarketHub Windows executable via Nuitka and publish a
# downloadable zip containing: the EXE + its runtime, the built frontend
# (frontend/dist), and an initialized data/ directory (the app's database).
#
# Triggers: push to the production-hardening branch, or manual dispatch.

on:
  push:
    branches: [b8-production-hardening]
  workflow_dispatch: {}

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "nuitka>=2.5"

      - name: Build frontend (vite -> frontend/dist)
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Compile standalone EXE with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --output-filename=MarketHub.exe `
            --output-dir=build `
            --include-package=app `
            --include-package=core `
            --include-package=mcp_server `
            --include-package=sources `
            --include-package=market `
            --include-package=brokers `
            --include-package=api `
            --follow-imports `
            --show-progress `
            build_entry.py

      - name: Assemble distributable folder
        run: |
          New-Item -ItemType Directory -Force -Path MarketHub | Out-Null
          Copy-Item -Recurse -Force build/build_entry.dist/* MarketHub/
          New-Item -ItemType Directory -Force -Path MarketHub/frontend | Out-Null
          Copy-Item -Recurse -Force frontend/dist MarketHub/frontend/dist
          New-Item -ItemType Directory -Force -Path MarketHub/data | Out-Null
          Copy-Item config.example.json MarketHub/config.json
          # Trim the redundant duplicate of the entry script if Nuitka left one.
          if (Test-Path MarketHub/build_entry.py) { Remove-Item MarketHub/build_entry.py }

      - name: Smoke test the EXE
        run: |
          $p = Start-Process -FilePath .\MarketHub\MarketHub.exe -PassThru
          Start-Sleep -Seconds 25
          try {
            $code = (Invoke-WebRequest -Uri http://127.0.0.1:7070/ui/ -UseBasicParsing -TimeoutSec 8).StatusCode
            Write-Host "UI endpoint responded with HTTP $code"
          } catch {
            Write-Host "UI endpoint not reachable during smoke test: $($_.Exception.Message)"
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Package zip
        run: Compress-Archive -Path MarketHub -DestinationPath MarketHub-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketHub-win64
          path: MarketHub-win64.zip
          retention-days: 14

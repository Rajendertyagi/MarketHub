name: b8-production-hardening

# B8 production hardening verification.
# Runs B8-specific tests + stress tests + full regression.
# Manual dispatch ONLY.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  b8-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: B8 FIX 1 — Alert locks retention
        run: python test/test_b8_alert_locks.py

      - name: B8 FIX 2 — Analytics scheduler concurrent refresh
        run: python test/test_b8_analytics_scheduler.py

      - name: B8 FIX 3 — ACK performance
        run: python test/test_b8_ack_performance.py

      - name: Stress tests (500 alerts)
        run: python -m pytest test/test_condition_alert_stress.py -q --tb=short

      - name: B7 multi-target tests
        run: python -m pytest test/test_b7_multi_target.py -q --tb=short

      - name: Condition groups tests
        run: python -m pytest test/test_condition_groups.py -q --tb=short

      - name: Acknowledgement tests
        run: python test/test_acknowledgement.py

      - name: Full regression (pytest)
        run: python -m pytest -q --tb=short

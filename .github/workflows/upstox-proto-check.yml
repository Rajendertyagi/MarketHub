name: upstox-proto-check

# Provenance enforcement for the vendored Upstox market-data feed binding:
#
#   official Upstox MarketDataFeed.proto  (vendored, SHA256-pinned)
#         ->  standard grpc_tools.protoc  (PINNED version below)
#         ->  generated MarketDataFeed_pb2.py
#
# CHECK-ONLY. This workflow NEVER modifies repository source: no git add,
# no commit, no push, no write-back. It generates into RUNNER_TEMP,
# uploads the generated file as an artifact, and compares it against the
# committed binding byte-for-byte.
#
# If the comparison fails, download the artifact and replace the committed
# binding via a normal reviewed commit — never by editing generated bytes.
#
# Generation happens ONLY here (or in a dev environment with the same
# pinned tool). grpcio-tools is NOT a runtime dependency; runtime needs
# protobuf only (requirements.txt).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned development-only generator
        run: pip install "grpcio-tools==1.80.0"

      - name: Show generator versions
        run: |
          python -m grpc_tools.protoc --version
          pip show grpcio-tools | head -n 2

      - name: Generate binding into RUNNER_TEMP (never over the repo copy)
        run: |
          GEN_ROOT="$RUNNER_TEMP/gen"
          mkdir -p "$GEN_ROOT"
          python -m grpc_tools.protoc \
            -I. \
            --python_out="$GEN_ROOT" \
            brokers/upstox/proto/MarketDataFeed.proto
          echo "GEN_FILE=$GEN_ROOT/brokers/upstox/proto/MarketDataFeed_pb2.py" >> "$GITHUB_ENV"

      - name: Upload generated binding (provenance artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MarketDataFeed_pb2-grpcio-tools-1-80-0
          path: ${{ env.GEN_FILE }}
          if-no-files-found: error

      - name: Byte-compare against committed binding
        run: |
          COMMITTED=brokers/upstox/proto/MarketDataFeed_pb2.py
          if cmp -s "$GEN_FILE" "$COMMITTED"; then
            echo "OK: committed binding is byte-identical to pinned-generator output"
          else
            echo "::error::Committed binding differs from pinned-generator output."
            echo "--- diff (committed vs generated) ---"
            diff -u "$COMMITTED" "$GEN_FILE" | head -n 80 || true
            echo "Next step: download the 'MarketDataFeed_pb2-grpcio-tools-1-80-0' artifact,"
            echo "replace brokers/upstox/proto/MarketDataFeed_pb2.py with it via a normal"
            echo "reviewed commit, then re-run this workflow."
            exit 1
          fi

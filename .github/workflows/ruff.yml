name: ruff

# Pinned minimal Python gate ([tool.ruff] in pyproject.toml).
#
# The WHOLE TREE is clean under this pinned rule set, so the gate covers
# everything. It was previously scoped to a handful of paths because the
# rest of the tree carried pre-existing findings; those are now fixed.
#
# Push + PR triggers. Read-only check; no deploy, publish, release, or
# repository-setting changes.

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install "ruff==0.16.5"

      - name: Ruff (whole tree)
        run: python -m ruff check .
